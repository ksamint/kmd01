[package]
name = "ksamint-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.7", features = ["http2", "json", "macros", "multipart"] }
base64.workspace = true
chrono = { version = "0.4.42", features = ["serde"] }
dashmap = "6.1.0"
getrandom = "0.3.4"
hmac = "0.12.1"
hex.workspace = true
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror.workspace = true
tokio.workspace = true
tower-cookies = "0.11.0"
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-full", "cors", "limit", "request-id", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.7"
uuid.workspace = true
vault-protocol = { path = "../vault-protocol" }
webauthn-rs = "0.5.4"
