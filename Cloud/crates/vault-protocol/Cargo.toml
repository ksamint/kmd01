[package]
name = "vault-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10.3"
bip39 = { version = "2.2.0", features = ["rand"] }
ciborium = "0.2.2"
getrandom = "0.4.3"
hkdf = "0.12.4"
hpke = { version = "0.14.0", default-features = false, features = ["aes", "alloc", "getrandom", "hkdfsha2", "nistp"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = "0.9.3"
serde.workspace = true
serde_bytes = "0.11.19"
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
