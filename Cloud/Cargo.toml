[workspace]
resolver = "2"
members = [
  "crates/vault-protocol",
  "crates/ksamint-api",
  "crates/ksamint-vault",
]

[workspace.package]
version = "2.5.5"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }
