name: Signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify protected main and exact tested commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_REF: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require trusted exact-commit CI
        id: commit
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$REQUESTED_REF"
          commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          python3 Scripts/ci-release-gates.py trusted-build "$commit"
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    name: Sign and submit a draft for acceptance
    runs-on: macos-26
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: aarch64-apple-darwin

      - name: Verify tag and version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assert_equal() {
            label="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              printf '%s mismatch: expected <%s>, got <%s>\n' \
                "$label" "$expected" "$actual" >&2
              exit 1
            fi
          }
          assert_equal Build.xcconfig "$version" \
            "$(sed -n 's/^MARKETING_VERSION = //p' Build.xcconfig)"
          assert_equal WebApp/package.json "$version" \
            "$(node -p "require('./WebApp/package.json').version")"
          assert_equal AgentSDK/package.json "$version" \
            "$(node -p "require('./AgentSDK/package.json').version")"
          assert_equal Cloud/Cargo.toml "$version" \
            "$(awk -F '"' '/^version = "/ { print $2; exit }' Cloud/Cargo.toml)"
          # Fetch the immutable release tag into an isolated ref. This works
          # whether checkout retained a local tag ref or only a detached HEAD.
          validation_ref="refs/tags/release-validation/$RELEASE_TAG"
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:$validation_ref"
          remote_tag_commit="$(git rev-list -n 1 "$validation_ref")"
          assert_equal release-tag "$(git rev-parse HEAD)" "$remote_tag_commit"
          node Scripts/validate-localizations.mjs
          node Scripts/validate-product-identity.mjs

      - name: Build CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Build Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm run build
          npm run build:mac
          npm run validate:mac-bundle

      - name: Build and pack read-only Agent SDK
        working-directory: AgentSDK
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Verify and package signed resource modules
        working-directory: ResourceModules
        run: |
          npm ci
          npm run verify
          version="${RELEASE_TAG#v}"
          ditto -c -k --keepParent dist "$RUNNER_TEMP/ksamint-resource-modules-$version.zip"

      - name: Import Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$intermediate"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          security import "$intermediate" -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          identity_line="$(security find-identity -v -p codesigning "$keychain" | \
            grep 'Developer ID Application:' | head -1)"
          test -n "$identity_line"
          identity_sha1="$(printf '%s\n' "$identity_line" | awk '{print $2}')"
          case "$identity_sha1" in
            *[!0-9A-F]*|'') echo 'Unable to resolve Developer ID identity' >&2; exit 1 ;;
          esac
          printf 'APPLE_DEVELOPER_ID_SHA1=%s\n' "$identity_sha1" >> "$GITHUB_ENV"

      - name: Install Developer ID provisioning profiles
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"
          token="$(KEY_PATH="$key" ruby -ropenssl -rjson -rbase64 -e '
            encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
            now = Time.now.to_i
            header = encode.call({alg: "ES256", kid: ENV.fetch("APPLE_NOTARY_KEY_ID"), typ: "JWT"}.to_json)
            payload = encode.call({iss: ENV.fetch("APPLE_NOTARY_ISSUER_ID"), iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)
            input = "#{header}.#{payload}"
            der = OpenSSL::PKey.read(File.read(ENV.fetch("KEY_PATH"))).sign(OpenSSL::Digest::SHA256.new, input)
            signature = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\0") }.join
            print "#{input}.#{encode.call(signature)}"
          ')"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          while IFS='|' read -r _bundle_id profile_name; do
            response="$(curl --fail --silent --show-error --get \
              -H "Authorization: Bearer $token" \
              --data-urlencode "filter[name]=$profile_name" \
              --data-urlencode 'filter[profileType]=MAC_APP_DIRECT' \
              https://api.appstoreconnect.apple.com/v1/profiles)"
            test "$(printf '%s' "$response" | jq '.data | length')" -eq 1
            test "$(printf '%s' "$response" | jq -r '.data[0].attributes.profileState')" = ACTIVE
            uuid="$(printf '%s' "$response" | jq -r '.data[0].attributes.uuid')"
            printf '%s' "$response" | jq -r '.data[0].attributes.profileContent' | \
              base64 --decode > "$profiles/$uuid.provisionprofile"
            security cms -D -i "$profiles/$uuid.provisionprofile" >/dev/null
          done <<'PROFILES'
          art.apuch.ksamint.markedit|ksamint MarkEdit Developer ID 2.5.6
          art.apuch.ksamint.markedit.conversation-capture-helper|ksamint Capture Helper Developer ID 2.5.6
          art.apuch.ksamint.markedit.finder-extension|ksamint Finder Extension Developer ID 2.5.6
          art.apuch.ksamint.markedit.preview-extension|ksamint Preview Extension Developer ID
          art.apuch.ksamint.markedit.quick-actions|ksamint Quick Actions Developer ID 2.5.6
          PROFILES
          unset token

      - name: Build and sign ARM64 recovery CLI
        working-directory: Cloud
        run: |
          cargo build --locked --release -p ksamint-vault --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/ksamint-vault "$RUNNER_TEMP/ksamint-vault"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_DEVELOPER_ID_SHA1" "$RUNNER_TEMP/ksamint-vault"
          "$RUNNER_TEMP/ksamint-vault" --version
          lipo -archs "$RUNNER_TEMP/ksamint-vault" | grep -q arm64
          if lipo -archs "$RUNNER_TEMP/ksamint-vault" | grep -q x86_64; then exit 1; fi
          ditto -c -k "$RUNNER_TEMP/ksamint-vault" "$RUNNER_TEMP/ksamint-vault-macos-arm64.zip"

      - name: Archive and export Universal app
        run: |
          commit="$(git rev-parse HEAD)"
          xcodebuild archive \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ksamint-MarkEdit.xcarchive" \
            -destination 'generic/platform=macOS' \
            -xcconfig ReleaseSigning.xcconfig \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_ID_SHA1" \
            ARCHS="arm64 x86_64" VALID_ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            KSAMINT_BUILD_COMMIT="$commit" \
            SWIFT_OPTIMIZATION_LEVEL="-Osize" \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=non-global \
            DEPLOYMENT_POSTPROCESSING=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string developer-id "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingCertificate -string "$APPLE_DEVELOPER_ID_SHA1" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          while IFS='|' read -r bundle_id profile_name; do
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$bundle_id string $profile_name" \
              "$RUNNER_TEMP/ExportOptions.plist"
          done <<'PROFILES'
          art.apuch.ksamint.markedit|ksamint MarkEdit Developer ID 2.5.6
          art.apuch.ksamint.markedit.conversation-capture-helper|ksamint Capture Helper Developer ID 2.5.6
          art.apuch.ksamint.markedit.finder-extension|ksamint Finder Extension Developer ID 2.5.6
          art.apuch.ksamint.markedit.preview-extension|ksamint Preview Extension Developer ID
          art.apuch.ksamint.markedit.quick-actions|ksamint Quick Actions Developer ID 2.5.6
          PROFILES
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ksamint-MarkEdit.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          Scripts/verify-release-app.sh \
            "$RUNNER_TEMP/export/kmd.app" "$APPLE_TEAM_ID" "$commit" universal

      - name: Create signed artifacts and submit each byte sequence once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          staging="$RUNNER_TEMP/dmg"
          dmg="$RUNNER_TEMP/ksamint-MarkEdit-$version.dmg"
          cli="$RUNNER_TEMP/ksamint-vault-macos-arm64.zip"
          mkdir -p "$staging"
          ditto "$RUNNER_TEMP/export/kmd.app" "$staging/kmd.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "kmd" -srcfolder "$staging" -ov -format UDBZ "$dmg"
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_ID_SHA1" "$dmg"
          dmg_size="$(stat -f '%z' "$dmg")"
          echo "Signed UDBZ size: $dmg_size bytes (limit: 6291456)"
          test "$dmg_size" -le 6291456

          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          dmg_submission="$(xcrun notarytool submit "$dmg" \
            --key "$notary_key" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --output-format json)"
          cli_submission="$(xcrun notarytool submit "$cli" \
            --key "$notary_key" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --output-format json)"
          dmg_id="$(printf '%s' "$dmg_submission" | jq -r '.id')"
          cli_id="$(printf '%s' "$cli_submission" | jq -r '.id')"
          test -n "$dmg_id" && test "$dmg_id" != null
          test -n "$cli_id" && test "$cli_id" != null

          jq -n \
            --arg tag "$RELEASE_TAG" --arg commit "$commit" --arg team "$APPLE_TEAM_ID" \
            --arg dmgAsset "$(basename "$dmg")" --arg dmgSubmission "$dmg_id" \
            --arg cliAsset "$(basename "$cli")" --arg cliSubmission "$cli_id" \
            --arg dmgSHA256 "$(shasum -a 256 "$dmg" | awk '{print $1}')" \
            --arg cliSHA256 "$(shasum -a 256 "$cli" | awk '{print $1}')" \
            '{schema:1, tag:$tag, commit:$commit, teamID:$team,
              dmg:{asset:$dmgAsset,submissionID:$dmgSubmission,sha256:$dmgSHA256},
              cli:{asset:$cliAsset,submissionID:$cliSubmission,sha256:$cliSHA256}}' \
            > "$RUNNER_TEMP/NotarySubmission.json"
          jq -n --arg commit "$commit" \
            '{minOSVer:"15.0",arch:"universal",commit:$commit}' \
            > "$RUNNER_TEMP/ReleaseInfo.json"
          shasum -a 256 \
            "$dmg" "$cli" \
            "$RUNNER_TEMP/ksamint-agent-sdk-$version.tgz" \
            "$RUNNER_TEMP/ksamint-resource-modules-$version.zip" \
            > "$RUNNER_TEMP/SHA256SUMS.pre-notary"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace submitted bytes." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$dmg" "$cli" \
            "$RUNNER_TEMP/ksamint-agent-sdk-$version.tgz" \
            "$RUNNER_TEMP/ksamint-resource-modules-$version.zip" \
            "$RUNNER_TEMP/ReleaseInfo.json" \
            "$RUNNER_TEMP/NotarySubmission.json" \
            "$RUNNER_TEMP/SHA256SUMS.pre-notary" \
            --repo "$GITHUB_REPOSITORY" --title "$version" \
            --generate-notes --verify-tag --draft

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
