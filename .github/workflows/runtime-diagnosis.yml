name: Temporary WebKit platform diagnosis

on:
  push:
    branches: [codex/runtime-diagnosis-39421305857]

permissions:
  contents: read

jobs:
  diagnose:
    name: Minimal WebKit startup (${{ matrix.variant }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [public-default]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record platform and exact diagnostic source
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/webkit-ab-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-commit.txt"
          sw_vers > "$evidence/macos.txt"
          uname -m > "$evidence/architecture.txt"
          xcodebuild -version > "$evidence/xcode.txt"
          find Scripts/diagnostics/webkit-ab -type f -exec shasum -a 256 {} \; > "$evidence/workflow-source.sha256"
          printf '%s\n' 'Public-API-only WebKit configuration control; no private selectors or baseline configuration compiled; not production app validation or release acceptance.' > "$evidence/purpose.txt"
      - name: Run up to 90 fresh process launches with bounded failure diagnostics
        env:
          CI_ISOLATED_RUNNER: ${{ runner.environment }}
        run: |
          set -euo pipefail
          bash Scripts/diagnostics/webkit-ab/run.sh "$DIAGNOSTIC_VARIANT" "$RUNNER_TEMP/webkit-ab-evidence" 90 2>&1 | tee "$RUNNER_TEMP/webkit-ab-evidence/driver.log"
      - name: Preserve diagnostic source hashes and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-platform-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/webkit-ab-evidence
          if-no-files-found: error
          retention-days: 7
