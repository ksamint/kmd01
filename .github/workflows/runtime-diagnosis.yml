name: Temporary runtime diagnosis

on:
  push:
    branches: [codex/runtime-diagnosis-39421305857]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Existing macOS 26 artifact with recorded harness changes
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnosis
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e7a6152a558b5461ce24910cc970a6a8d9e64880
          path: tested-source
          persist-credentials: false
      - name: Download and verify the immutable existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/runtime-diagnosis"
          mkdir -p "$evidence"
          gh api repos/ksamint/kmd01/actions/artifacts/12264096816 > "$evidence/artifact-metadata.json"
          jq -e '.id == 12264096816 and .name == "macos-26-release" and .expired == false and .workflow_run.id == 39421305857 and .workflow_run.head_sha == "c2f5e13c3ece3410765ae64e93252330d2c2f2c6" and .digest == "sha256:b2598d18d5c0c23f6843ac14409cd8a4400b6aed0304d46b836e8b0a5fdc870a"' "$evidence/artifact-metadata.json"
          gh run download 39421305857 --repo ksamint/kmd01 --name macos-26-release --dir "$evidence/input"
          cd "$evidence/input"
          test "$(cat commit.txt)" = e7a6152a558b5461ce24910cc970a6a8d9e64880
          test "$(shasum -a 256 kmd-release.zip | awk '{print $1}')" = f19655f38c8c8f63ee7cefcc20500e1d201478bb92609381c79968acef2c0ca1
          shasum -a 256 -c kmd-release.zip.sha256
          # Keep prior-run runtime evidence separate from this diagnostic result.
          rm -f runtime.log runtime-macos.txt runtime-architecture.txt
          rm -rf diagnostics
      - name: Record and apply only the two diagnostic harness files
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/runtime-diagnosis"
          tested="$GITHUB_WORKSPACE/tested-source"
          test "$(git -C "$tested" rev-parse HEAD)" = e7a6152a558b5461ce24910cc970a6a8d9e64880
          git -C "$GITHUB_WORKSPACE/diagnosis" rev-parse HEAD > "$evidence/harness-commit.txt"
          for file in ci-document-smoke.js test-document-open-smoke.sh; do
            cp "$GITHUB_WORKSPACE/diagnosis/Scripts/$file" "$tested/Scripts/$file"
          done
          git -C "$tested" diff -- Scripts/ci-document-smoke.js Scripts/test-document-open-smoke.sh > "$evidence/harness.diff"
          (cd "$tested" && shasum -a 256 Scripts/ci-document-smoke.js Scripts/test-document-open-smoke.sh) > "$evidence/harness.sha256"
          printf '%s\n' 'Diagnostic only: unchanged prior-build app, recorded harness changes; not release acceptance or full CI.' > "$evidence/purpose.txt"
      - name: Run the existing signature and isolated lifecycle checks
        env:
          CI_ISOLATED_RUNNER: ${{ runner.environment }}
          CI_RUNTIME_ARCH: arm64
        run: |
          set -euo pipefail
          tested="$GITHUB_WORKSPACE/tested-source"
          GITHUB_WORKSPACE="$tested" "$tested/Scripts/ci-runtime-smoke.sh" "$RUNNER_TEMP/runtime-diagnosis/input" 2>&1 | tee "$RUNNER_TEMP/runtime-diagnosis/diagnosis.log"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-diagnosis-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-diagnosis/*.json
            ${{ runner.temp }}/runtime-diagnosis/*.txt
            ${{ runner.temp }}/runtime-diagnosis/*.diff
            ${{ runner.temp }}/runtime-diagnosis/*.sha256
            ${{ runner.temp }}/runtime-diagnosis/*.log
            ${{ runner.temp }}/runtime-diagnosis/input/runtime.log
            ${{ runner.temp }}/runtime-diagnosis/input/runtime-macos.txt
            ${{ runner.temp }}/runtime-diagnosis/input/runtime-architecture.txt
            ${{ runner.temp }}/runtime-diagnosis/input/commit.txt
            ${{ runner.temp }}/runtime-diagnosis/input/kmd-release.zip.sha256
            ${{ runner.temp }}/runtime-diagnosis/input/diagnostics/*.ips
          if-no-files-found: error
          retention-days: 7
