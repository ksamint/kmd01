name: Build and test

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Run the GitHub-hosted macOS 26 and macOS 15 builds
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      web: ${{ steps.filter.outputs.web }}
      cloud: ${{ steps.filter.outputs.cloud }}
      cloud_audit: ${{ steps.filter.outputs.cloud_audit }}
      resource_modules: ${{ steps.filter.outputs.resource_modules }}
      agent_sdk: ${{ steps.filter.outputs.agent_sdk }}
      agent_contracts: ${{ steps.filter.outputs.agent_contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            for name in mac web cloud cloud_audit resource_modules agent_sdk agent_contracts; do
              printf '%s=true\n' "$name" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-files"
          set_output() {
            name="$1"
            pattern="$2"
            if grep -Eq "$pattern" "$RUNNER_TEMP/changed-files"; then
              printf '%s=true\n' "$name" >> "$GITHUB_OUTPUT"
            else
              printf '%s=false\n' "$name" >> "$GITHUB_OUTPUT"
            fi
          }

          set_output mac '^(MarkEditMac/|MarkEditKit/|MarkEditCore/|MarkEdit\.xcodeproj/|FinderExtension/|PreviewExtension/|QuickActionExtension/|ConversationCaptureHelper/|CoreEditor/|Build\.xcconfig$|Icon\.(png|icns)$|Scripts/(configure-system-integration-targets|test-document-open-smoke|validate-localizations|validate-product-identity)\.)'
          set_output web '^(WebApp/|CoreEditor/|VaultProtocolTS/)'
          set_output cloud '^(Cloud/)'
          set_output cloud_audit '^(Cloud/(Cargo\.(toml|lock)|audit\.sh)|\.github/dependabot\.yml$)'
          set_output resource_modules '^(ResourceModules/)'
          set_output agent_sdk '^(AgentSDK/)'
          set_output agent_contracts '^(AgentSDK/|MarkEditMac/.*(Agent|MCP))'

  resource-modules:
    name: Signed resource preview modules
    needs: changes
    if: needs.changes.outputs.resource_modules == 'true'
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify signatures, hashes, sandbox policy, and archive parsers
        working-directory: ResourceModules
        run: |
          npm ci
          npm audit --audit-level=high
          npm run verify

  agent-sdk:
    name: Read-only Agent SDK
    needs: changes
    if: needs.changes.outputs.agent_sdk == 'true'
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate TypeScript SDK
        working-directory: AgentSDK
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

  local-agent-cli-contracts:
    name: Local Agent CLI contracts
    needs: changes
    if: needs.changes.outputs.agent_contracts == 'true'
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install supported CLI protocol fixtures
        run: >-
          npm install --prefix "$RUNNER_TEMP/agent-clis" --no-package-lock --no-save
          @openai/codex@0.142.5 @anthropic-ai/claude-code@2.1.173
      - name: Validate Codex app-server contract
        run: |
          codex="$RUNNER_TEMP/agent-clis/node_modules/.bin/codex"
          "$codex" --version | grep -F '0.142.5'
          "$codex" app-server --help | grep -F -- '--config'
          "$codex" app-server --help | grep -F -- '--stdio'
      - name: Validate Claude Code stream-json contract
        run: |
          claude="$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
          "$claude" --version | grep -F '2.1.173'
          "$claude" --help | grep -F -- '--input-format'
          "$claude" --help | grep -F -- '--output-format'
          "$claude" --help | grep -F -- '--permission-mode'
          "$claude" --help | grep -F -- '--mcp-config'

  cloud:
    name: Private cloud and recovery
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    defaults:
      run:
        working-directory: Cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Check formatting and warnings
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test protocol, API, and recovery
        run: cargo test --workspace
      - name: Audit changed Rust dependencies
        if: needs.changes.outputs.cloud_audit == 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          ./audit.sh
      - name: Validate Tencent sync environment wiring
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          TENCENT_SECRET_ID: ci-secret-id
          TENCENT_SECRET_KEY: ci-secret-key
          TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole
          TENCENT_COS_BUCKET: ksamint-vault-1308586823
          TENCENT_COS_REGION: ap-singapore
          TENCENT_APP_ID: "1308586823"
        run: |
          docker compose -f docker-compose.tencent.yml config > /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_ID: ci-secret-id' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_KEY: ci-secret-key' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_COS_BUCKET: ksamint-vault-1308586823' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_APP_ID: "1308586823"' /tmp/ksamint-compose.yml

  web:
    name: Web and CoreEditor
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64, apuch-ci, nanjing, kmd01]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build and test CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn npm audit --severity high --all
          yarn build
          yarn test
      - name: Build and test Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build
          npm run build:mac
          npm run validate:mac-bundle

  mac:
    name: kmd (ARM64, macOS 26)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.full_compatibility && needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate localizations and identity
        run: |
          node Scripts/validate-localizations.mjs
          node Scripts/validate-product-identity.mjs
      - name: Build CoreEditor assets
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build kmd
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Test Swift packages
        run: |
          swift test --package-path MarkEditKit
          xcodebuild test \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditCoreTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          xcodebuild test \
            -project MarkEdit.xcodeproj \
            -scheme ModulesTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  compatibility:
    name: macOS 15 release compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.full_compatibility
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build CoreEditor assets
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build deployment-target release
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
