name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      web: ${{ steps.filter.outputs.web }}
      cloud: ${{ steps.filter.outputs.cloud }}
      cloud_audit: ${{ steps.filter.outputs.cloud_audit }}
      resource_modules: ${{ steps.filter.outputs.resource_modules }}
      agent_sdk: ${{ steps.filter.outputs.agent_sdk }}
      agent_contracts: ${{ steps.filter.outputs.agent_contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            for name in mac web cloud cloud_audit resource_modules agent_sdk agent_contracts; do
              printf '%s=true\n' "$name" >> "$GITHUB_OUTPUT"
            done
          else
            git diff --name-only "$BASE_SHA"...HEAD | \
              python3 Scripts/ci-release-gates.py classify >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Identity, localization, and release gate regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: |
          node Scripts/validate-product-identity.mjs
          node Scripts/validate-localizations.mjs
          python3 Scripts/test-ci-release-gates.py
          python3 Scripts/test-ci-candidate-provenance.py
          node Scripts/test-ci-document-smoke.cjs
          python3 Scripts/test-release-profile.py
          python3 Scripts/test-release-signing.py
          python3 Scripts/test-safe-installer.py

  resource-modules:
    name: Signed resource preview modules
    needs: changes
    if: needs.changes.outputs.resource_modules == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify signatures, hashes, sandbox policy, and archive parsers
        working-directory: ResourceModules
        run: |
          npm ci
          npm audit --audit-level=high
          npm run verify

  agent-sdk:
    name: Read-only Agent SDK
    needs: changes
    if: needs.changes.outputs.agent_sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate TypeScript SDK
        working-directory: AgentSDK
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

  local-agent-cli-contracts:
    name: Local Agent CLI contracts
    needs: changes
    if: needs.changes.outputs.agent_contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install supported CLI protocol fixtures
        run: >-
          npm install --prefix "$RUNNER_TEMP/agent-clis" --no-package-lock --no-save
          @openai/codex@0.142.5 @anthropic-ai/claude-code@2.1.173
      - name: Validate Codex app-server contract
        run: |
          codex="$RUNNER_TEMP/agent-clis/node_modules/.bin/codex"
          "$codex" --version | grep -F '0.142.5'
          "$codex" app-server --help | grep -F -- '--config'
          "$codex" app-server --help | grep -F -- '--stdio'
      - name: Validate Claude Code stream-json contract
        run: |
          claude="$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
          "$claude" --version | grep -F '2.1.173'
          "$claude" --help | grep -F -- '--input-format'
          "$claude" --help | grep -F -- '--output-format'
          "$claude" --help | grep -F -- '--permission-mode'
          "$claude" --help | grep -F -- '--mcp-config'

  cloud:
    name: Private cloud and recovery
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Check formatting and warnings
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test protocol, API, and recovery
        run: cargo test --workspace
      - name: Audit changed Rust dependencies
        if: needs.changes.outputs.cloud_audit == 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          ./audit.sh
      - name: Validate Tencent sync environment wiring
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          TENCENT_SECRET_ID: ci-secret-id
          TENCENT_SECRET_KEY: ci-secret-key
          TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole
          TENCENT_COS_BUCKET: ksamint-vault-1308586823
          TENCENT_COS_REGION: ap-singapore
          TENCENT_APP_ID: "1308586823"
        run: |
          docker compose -f docker-compose.tencent.yml config > /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_ID: ci-secret-id' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_KEY: ci-secret-key' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_COS_BUCKET: ksamint-vault-1308586823' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_APP_ID: "1308586823"' /tmp/ksamint-compose.yml

  web:
    name: Web and CoreEditor
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build and test CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn npm audit --severity high --all
          yarn build
          yarn test
      - name: Build and test Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build
          npm run build:mac
          npm run validate:mac-bundle

  mac:
    name: kmd Release (macOS ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: '26'
            runner: macos-26
            xcode: '26.6'
          - os: '15'
            runner: macos-15
            xcode: '26.3'
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build CoreEditor assets
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Release build, Swift and clipboard tests, runtime smoke
        run: Scripts/ci-test-macos.sh '${{ matrix.os }}'
      - name: Preserve build, test, runtime and exact artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.os }}-release
          path: |
            ${{ runner.temp }}/macos-${{ matrix.os }}-evidence
          if-no-files-found: error
          retention-days: 14

  runtime-compatibility:
    name: macOS 26 Release on macOS 15 (${{ matrix.arch }})
    needs: [changes, mac]
    if: needs.changes.outputs.mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the exact macOS 26 build
        env:
          CI_ISOLATED_RUNNER: ${{ runner.environment }}
          CI_RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name macos-26-release --dir "$RUNNER_TEMP/cross-runtime"
          artifact="$(find "$RUNNER_TEMP/cross-runtime" -name kmd-release.zip -print)"
          test -f "$artifact"
          Scripts/ci-runtime-smoke.sh "$(dirname "$artifact")"
      - name: Preserve cross-version runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-26-on-15-${{ matrix.arch }}-runtime
          path: |
            ${{ runner.temp }}/cross-runtime/**/runtime.log
            ${{ runner.temp }}/cross-runtime/**/runtime-macos.txt
            ${{ runner.temp }}/cross-runtime/**/runtime-architecture.txt
            ${{ runner.temp }}/cross-runtime/**/commit.txt
            ${{ runner.temp }}/cross-runtime/**/kmd-release.zip.sha256
            ${{ runner.temp }}/cross-runtime/**/diagnostics/*.ips
          if-no-files-found: error
          retention-days: 14

  readiness:
    name: Release readiness
    if: always()
    needs: [changes, quality, resource-modules, agent-sdk, local-agent-cli-contracts, cloud, web, mac, runtime-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 Scripts/ci-release-gates.py readiness
