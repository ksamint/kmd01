name: Signed local install artifact
run-name: Signed local ${{ inputs.architecture }} ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to build
        required: true
        type: string
      architecture:
        description: Architectures for this local install artifact
        required: true
        default: arm64
        type: choice
        options:
          - arm64

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-local-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify protected main and exact tested commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require trusted exact-commit CI
        id: commit
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          commit="$REQUESTED_REF"
          python3 Scripts/ci-release-gates.py trusted-build "$commit"
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  signed-local:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Verify exact immutable commit
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate identity, localizations, and clipboard privacy
        run: |
          node Scripts/validate-product-identity.mjs
          node Scripts/validate-localizations.mjs
          Scripts/ci-test-clipboard.sh
      - name: Build CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Import Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/local-install.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$intermediate"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          security import "$intermediate" -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          identity_line="$(security find-identity -v -p codesigning "$keychain" | \
            grep 'Developer ID Application:' | head -1)"
          test -n "$identity_line"
          identity_sha1="$(printf '%s\n' "$identity_line" | awk '{print $2}')"
          case "$identity_sha1" in
            *[!0-9A-F]*|'') echo 'Unable to resolve Developer ID identity' >&2; exit 1 ;;
          esac
          printf 'APPLE_DEVELOPER_ID_SHA1=%s\n' "$identity_sha1" >> "$GITHUB_ENV"
      - name: Install Developer ID provisioning profiles
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"
          token="$(KEY_PATH="$key" ruby -ropenssl -rjson -rbase64 -e '
            encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
            now = Time.now.to_i
            header = encode.call({alg: "ES256", kid: ENV.fetch("APPLE_NOTARY_KEY_ID"), typ: "JWT"}.to_json)
            payload = encode.call({iss: ENV.fetch("APPLE_NOTARY_ISSUER_ID"), iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)
            input = "#{header}.#{payload}"
            der = OpenSSL::PKey.read(File.read(ENV.fetch("KEY_PATH"))).sign(OpenSSL::Digest::SHA256.new, input)
            signature = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\\0") }.join
            print "#{input}.#{encode.call(signature)}"
          ')"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          while IFS='|' read -r _bundle_id profile_name; do
            response="$(curl --fail --silent --show-error --get \
              -H "Authorization: Bearer $token" \
              --data-urlencode "filter[name]=$profile_name" \
              --data-urlencode 'filter[profileType]=MAC_APP_DIRECT' \
              https://api.appstoreconnect.apple.com/v1/profiles)"
            test "$(printf '%s' "$response" | jq '.data | length')" -eq 1
            test "$(printf '%s' "$response" | jq -r '.data[0].attributes.profileState')" = ACTIVE
            uuid="$(printf '%s' "$response" | jq -r '.data[0].attributes.uuid')"
            printf '%s' "$response" | jq -r '.data[0].attributes.profileContent' | \
              base64 --decode > "$profiles/$uuid.provisionprofile"
            security cms -D -i "$profiles/$uuid.provisionprofile" > /dev/null
          done <<'PROFILES'
          art.apuch.ksamint.markedit|ksamint MarkEdit Developer ID 2.5.6
          art.apuch.ksamint.markedit.conversation-capture-helper|ksamint Capture Helper Developer ID 2.5.6
          art.apuch.ksamint.markedit.finder-extension|ksamint Finder Extension Developer ID 2.5.6
          art.apuch.ksamint.markedit.preview-extension|ksamint Preview Extension Developer ID
          art.apuch.ksamint.markedit.quick-actions|ksamint Quick Actions Developer ID 2.5.6
          PROFILES
          unset token
      - name: Archive signed app
        run: |
          test '${{ inputs.architecture }}' = arm64
          xcodebuild archive \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ksamint.xcarchive" \
            -destination 'generic/platform=macOS' \
            -xcconfig ReleaseSigning.xcconfig \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_ID_SHA1" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            KSAMINT_BUILD_COMMIT='${{ needs.preflight.outputs.commit }}' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string developer-id "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingCertificate -string "$APPLE_DEVELOPER_ID_SHA1" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          while IFS='|' read -r bundle_id profile_name; do
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$bundle_id string $profile_name" \
              "$RUNNER_TEMP/ExportOptions.plist"
          done <<'PROFILES'
          art.apuch.ksamint.markedit|ksamint MarkEdit Developer ID 2.5.6
          art.apuch.ksamint.markedit.conversation-capture-helper|ksamint Capture Helper Developer ID 2.5.6
          art.apuch.ksamint.markedit.finder-extension|ksamint Finder Extension Developer ID 2.5.6
          art.apuch.ksamint.markedit.preview-extension|ksamint Preview Extension Developer ID
          art.apuch.ksamint.markedit.quick-actions|ksamint Quick Actions Developer ID 2.5.6
          PROFILES
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ksamint.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/kmd.app" \
            "$RUNNER_TEMP/ksamint-MarkEdit-signed-unstapled.zip"
      - name: Preserve signed bytes before contacting Apple
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ksamint-MarkEdit-signed-unstapled
          path: ${{ runner.temp }}/ksamint-MarkEdit-signed-unstapled.zip
          if-no-files-found: error
          retention-days: 14
      - name: Notarize, staple, and verify
        run: |
          app="$RUNNER_TEMP/export/kmd.app"
          before="$RUNNER_TEMP/ksamint-MarkEdit-signed-unstapled.zip"
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"
          submission="$(xcrun notarytool submit "$before" \
            --key "$key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --output-format json)"
          submission_id="$(printf '%s' "$submission" | jq -r '.id')"
          test -n "$submission_id"
          test "$submission_id" != null
          echo "Notary submission: $submission_id"
          deadline="$(( $(date +%s) + 900 ))"
          while true; do
            if status_json="$(xcrun notarytool info "$submission_id" \
              --key "$key" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --output-format json)"; then
              status="$(printf '%s' "$status_json" | jq -r '.status')"
              echo "Current status: $status"
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  xcrun notarytool log "$submission_id" \
                    --key "$key" \
                    --key-id "$APPLE_NOTARY_KEY_ID" \
                    --issuer "$APPLE_NOTARY_ISSUER_ID" || true
                  exit 1
                  ;;
              esac
            else
              echo 'Transient notary status request failure; retrying.' >&2
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for notarization: $submission_id" >&2
              exit 1
            fi
            sleep 30
          done
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute -vv "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/kmd")"
          echo "$archs" | grep -qw arm64
          if echo "$archs" | grep -qw x86_64; then exit 1; fi
          test -d "$app/Contents/Library/LoginItems/ConversationCaptureHelper.app"
          test -d "$app/Contents/PlugIns/QuickActionExtension.appex"
          Scripts/verify-release-app.sh "$app" "$APPLE_TEAM_ID" '${{ needs.preflight.outputs.commit }}' arm64
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ksamint-MarkEdit-signed-local.zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 ksamint-MarkEdit-signed-local.zip > ksamint-MarkEdit-signed-local.zip.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ksamint-MarkEdit-signed-local
          path: |
            ${{ runner.temp }}/ksamint-MarkEdit-signed-local.zip
            ${{ runner.temp }}/ksamint-MarkEdit-signed-local.zip.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/local-install.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
