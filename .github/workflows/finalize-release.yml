name: Finalize notarized release

on:
  workflow_run:
    workflows: ["Signed release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional draft release tag; all pending drafts are checked when omitted
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-finalizer
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require protected main before exposing release credentials
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true

  finalize:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare stapled drafts; publish only exact-artifact runtime acceptance
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"

          if [ -n "${REQUESTED_TAG:-}" ]; then
            tags="$REQUESTED_TAG"
          else
            tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
              --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')"
          fi

          for tag in $tags; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            work="$RUNNER_TEMP/finalize-${tag//\//-}"
            mkdir -p "$work"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --dir "$work" --pattern NotarySubmission.json; then
              echo "$tag has no persisted notarization metadata; skipping."
              continue
            fi
            metadata="$work/NotarySubmission.json"
            test "$(jq -r '.tag' "$metadata")" = "$tag"
            commit="$(jq -r '.commit' "$metadata")"
            team="$(jq -r '.teamID' "$metadata")"
            test "$team" = "$APPLE_TEAM_ID"
            git fetch --force --tags origin "$tag"
            test "$(git rev-list -n 1 "$tag")" = "$commit"
            python3 Scripts/ci-release-gates.py trusted-build "$commit"

            all_accepted=true
            for id in $(jq -r '.dmg.submissionID,.cli.submissionID' "$metadata"); do
              info="$(xcrun notarytool info "$id" --key "$key" \
                --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
                --output-format json)"
              status="$(printf '%s' "$info" | jq -r '.status')"
              echo "$tag $id: $status"
              case "$status" in
                Accepted) ;;
                Invalid|Rejected)
                  log="$work/notary-$id.json"
                  xcrun notarytool log "$id" --key "$key" \
                    --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
                    "$log" || true
                  gh release upload "$tag" "$log" --repo "$GITHUB_REPOSITORY" --clobber
                  echo "Apple rejected $tag submission $id; the draft remains unpublished." >&2
                  exit 1 ;;
                *) all_accepted=false ;;
              esac
            done
            if ! $all_accepted; then
              echo "$tag remains in progress; no bytes were resubmitted."
              continue
            fi

            dmg_asset="$(jq -r '.dmg.asset' "$metadata")"
            cli_asset="$(jq -r '.cli.asset' "$metadata")"
            test "$dmg_asset" = "ksamint-MarkEdit-${tag#v}.dmg"
            test "$cli_asset" = ksamint-vault-macos-arm64.zip
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$work" \
              --pattern "$dmg_asset" --pattern "$cli_asset" \
              --pattern 'ksamint-agent-sdk-*.tgz' --pattern 'ksamint-resource-modules-*.zip' \
              --pattern ReleaseInfo.json
            dmg="$work/$dmg_asset"
            cli="$work/$cli_asset"
            test "$(shasum -a 256 "$dmg" | awk '{print $1}')" = "$(jq -r '.dmg.stapledSHA256 // .dmg.sha256' "$metadata")"
            test "$(shasum -a 256 "$cli" | awk '{print $1}')" = "$(jq -r '.cli.sha256' "$metadata")"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"

            mount="$work/mount"
            mkdir -p "$mount"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
            app="$mount/kmd.app"
            Scripts/verify-release-app.sh "$app" "$team" "$commit" universal
            spctl --assess --type execute -vv "$app"
            hdiutil detach "$mount"

            cli_dir="$work/cli"
            mkdir -p "$cli_dir"
            ditto -x -k "$cli" "$cli_dir"
            cli_binary="$cli_dir/ksamint-vault"
            codesign --verify --strict --verbose=2 "$cli_binary"
            test "$(codesign -dvv "$cli_binary" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$team"
            lipo -archs "$cli_binary" | grep -qw arm64
            if lipo -archs "$cli_binary" | grep -qw x86_64; then exit 1; fi

            size="$(stat -f '%z' "$dmg")"
            echo "Stapled UDBZ size: $size bytes (limit: 6291456)"
            test "$size" -le 6291456
            version="${tag#v}"
            shasum -a 256 \
              "$dmg" "$cli" \
              "$work/ksamint-agent-sdk-$version.tgz" \
              "$work/ksamint-resource-modules-$version.zip" \
              | sed "s#$work/##" > "$work/SHA256SUMS"
            jq --arg sha "$(shasum -a 256 "$dmg" | awk '{print $1}')" \
              '.dmg.stapledSHA256 = $sha' "$metadata" > "$work/NotarySubmission.next.json"
            mv "$work/NotarySubmission.next.json" "$metadata"
            gh release upload "$tag" "$dmg" "$work/SHA256SUMS" "$metadata" \
              --repo "$GITHUB_REPOSITORY" --clobber

            # Acceptance is reviewed on protected main after testing these exact stapled bytes.
            acceptance_path="docs/release-acceptance/$tag.json"
            if ! git show "origin/main:$acceptance_path" > "$work/RuntimeAcceptance.json"; then
              echo "$tag is ready for runtime acceptance; draft remains unpublished."
              continue
            fi
            python3 Scripts/ci-release-gates.py acceptance \
              "$work/RuntimeAcceptance.json" "$commit" "$dmg" "$cli" \
              "$work/ksamint-agent-sdk-$version.tgz" "$work/ksamint-resource-modules-$version.zip"
            gh release upload "$tag" "$work/RuntimeAcceptance.json" \
              --repo "$GITHUB_REPOSITORY" --clobber
            # The releases/tags REST endpoint deliberately hides draft
            # releases, and not every supported gh build exposes databaseId
            # from `gh release list`. Resolve the authenticated draft ID from
            # the REST collection without changing or resubmitting any bytes.
            release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" \
              | head -1)"
            test -n "$release_id"
            pre_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq '.assets[] | select(.name=="SHA256SUMS.pre-notary") | .id')"
            if [ -n "$pre_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$pre_id"
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft=false --latest --verify-tag

            sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            tap="$(brew --repository)/Library/Taps/fengurt/homebrew-ksamint"
            cask="fengurt/ksamint/kmd"
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            if [[ "$HOMEBREW_TAP_DEPLOY_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
              normalized_key="${HOMEBREW_TAP_DEPLOY_KEY//\\n/$'\n'}"
              printf '%s\n' "$normalized_key" > "$HOME/.ssh/ksamint_tap"
            else
              printf '%s' "$HOMEBREW_TAP_DEPLOY_KEY" \
                | base64 --decode > "$HOME/.ssh/ksamint_tap"
            fi
            chmod 600 "$HOME/.ssh/ksamint_tap"
            ssh-keygen -y -f "$HOME/.ssh/ksamint_tap" >/dev/null
            ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/ksamint_tap -o IdentitiesOnly=yes"
            if [ -d "$tap" ]; then
              brew untap --force fengurt/ksamint
            fi
            git clone git@github.com:fengurt/homebrew-ksamint.git "$tap"
            mkdir -p "$tap/Casks"
            ruby Scripts/render-cask.rb "$version" "$sha" > "$tap/Casks/kmd.rb"
            rm -f "$tap/Casks/ksamint-markedit.rb"
            printf '%s\n' \
              '{' \
              '  "ksamint-markedit": "kmd"' \
              '}' > "$tap/cask_renames.json"
            brew style --cask "$cask"
            # This is an update in our existing Tap. `--new` is reserved for
            # a future submission to homebrew/cask after GitHub detaches this
            # repository from its upstream fork network.
            brew audit --strict --cask "$cask"
            brew install --cask --appdir="$RUNNER_TEMP/cask-apps" "$cask"
            test -d "$RUNNER_TEMP/cask-apps/kmd.app"
            brew uninstall --cask "$cask"
            git -C "$tap" config user.name github-actions
            git -C "$tap" config user.email github-actions@github.com
            git -C "$tap" add Casks/kmd.rb cask_renames.json
            git -C "$tap" rm --ignore-unmatch Casks/ksamint-markedit.rb
            git -C "$tap" commit -m "kmd: renamed from ksamint-markedit ($version)"
            git -C "$tap" push
            rm -f "$HOME/.ssh/ksamint_tap"
          done

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" \
            "$HOME/.ssh/ksamint_tap"
